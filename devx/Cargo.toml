[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.74"

[workspace.dependencies]
devx-core = { path = "crates/devx-core" }
devx-tui = { path = "crates/devx-tui" }
devx-files = { path = "crates/devx-files" }
devx-tools = { path = "crates/devx-tools" }

ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.8"
vt100 = "0.15"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ignore = "0.4"
regex = "1"
tempfile = "3"
